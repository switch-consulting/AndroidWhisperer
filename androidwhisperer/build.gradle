plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.maven.publish)
}

android {
    namespace 'de.switchconsulting.whisper'
    compileSdk 35

    defaultConfig {
        minSdk 23

        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            // Do not support 32-bit architectures ('armeabi-v7a', 'x86').
            // Whisper relies heavily on 64-bit ARM NEON/SIMD optimizations.
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384",
                          "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384",
                          "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Keep native library packaging consistent across build variants.
            useLegacyPackaging = false
        }
    }
}

mavenPublishing {
    coordinates(
        providers.gradleProperty("GROUP").orElse("de.switch-consulting").get(),
        providers.gradleProperty("POM_ARTIFACT_ID").orElse("androidwhisperer").get(),
        providers.gradleProperty("VERSION_NAME").orElse("0.1.0-SNAPSHOT").get()
    )

    configure(new com.vanniktech.maven.publish.AndroidSingleVariantLibrary("release", false, true))

    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL, true)
    signAllPublications()

    pom {
        name = "AndroidWhisperer"
        description = "Android wrapper and JNI bindings for whisper.cpp speech recognition"
        inceptionYear = "2025"
        url = "https://github.com/switchconsulting/AndroidWhisperer"

        licenses {
            license {
                name = "The MIT License"
                url = "https://opensource.org/licenses/MIT"
                distribution = "repo"
            }
        }

        developers {
            developer {
                id = "switchconsulting"
                name = "Switch Consulting"
                url = "https://github.com/switchconsulting"
            }
        }

        scm {
            connection = "scm:git:git://github.com/switchconsulting/AndroidWhisperer.git"
            developerConnection = "scm:git:ssh://github.com/switchconsulting/AndroidWhisperer.git"
            url = "https://github.com/switchconsulting/AndroidWhisperer"
        }
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.19.1@aar'
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

tasks.matching { it.name.contains("javaDoc") || it.name.contains("JavaDoc") }.configureEach {
    actions.clear()
    def buildDirFile = layout.buildDirectory.get().asFile
    doLast {
        def jarFile = new File(buildDirFile, "intermediates/java_doc_jar/release/release-javadoc.jar")
        jarFile.parentFile.mkdirs()
        if (!jarFile.exists()) {
            def zos = new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(jarFile))
            zos.putNextEntry(new java.util.zip.ZipEntry("META-INF/MANIFEST.MF"))
            zos.write("Manifest-Version: 1.0\nCreated-By: AndroidWhisperer\n\n".getBytes("UTF-8"))
            zos.closeEntry()
            zos.close()
        }
    }
}

tasks.register('downloadWhisperModel') {
    description = 'Downloads Whisper GGML model file from HuggingFace into src/main/assets/models'
    group = 'whisper'

    def whisperModelProvider = providers.gradleProperty('whisperModel').orElse('tiny')
    def modelsDir = file("src/main/assets/models")

    doLast {
        def modelParam = whisperModelProvider.get()
        def variant = modelParam.trim()
        if (variant.startsWith('ggml-')) {
            variant = variant.substring(5)
        }
        if (variant.endsWith('.bin')) {
            variant = variant.substring(0, variant.length() - 4)
        }

        def fileName = "ggml-${variant}.bin"
        def targetFile = new File(modelsDir, fileName)

        if (!modelsDir.exists()) {
            modelsDir.mkdirs()
        }

        if (targetFile.exists() && targetFile.length() > 0) {
            logger.lifecycle("Whisper model file already exists: ${targetFile.absolutePath}")
            return
        }

        def downloadUrl = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/${fileName}"
        logger.lifecycle("Downloading Whisper model '${variant}' from ${downloadUrl}...")

        ant.get(src: downloadUrl, dest: targetFile, skipexistic: false)
        logger.lifecycle("Successfully downloaded ${fileName} (${targetFile.length()} bytes)")
    }
}
