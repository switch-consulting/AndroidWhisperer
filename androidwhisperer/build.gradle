plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'de.switchconsulting.whisper'
    compileSdk 35

    defaultConfig {
        minSdk 23

        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384",
                          "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs', layout.buildDirectory.dir("generated/jniLibs").get().asFile]
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Keep native library packaging consistent across build variants.
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.19.1'
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

tasks.register('extractJnaNatives') {
    description = 'Extracts and maps libjnidispatch.so from JNA dependency into build/generated/jniLibs'
    group = 'build'
    notCompatibleWithConfigurationCache("One-time extraction")

    outputs.dir(layout.buildDirectory.dir("generated/jniLibs"))

    doLast {
        def gradleUserHome = gradle.getGradleUserHomeDir().absolutePath
        def jnaJarFile = file("${gradleUserHome}/caches/modules-2/files-2.1/net.java.dev.jna/jna/5.19.1/ca303052cd617c1af2e2c8d344c98a706fb63143/jna-5.19.1.jar")
        if (!jnaJarFile.exists()) {
            throw new GradleException("JNA jar not found at ${jnaJarFile.absolutePath}")
        }
        logger.lifecycle("Using JNA jar: ${jnaJarFile.absolutePath}")

        def mapping = [
            'linux-aarch64/libjnidispatch.so': 'arm64-v8a',
            'linux-arm/libjnidispatch.so': 'armeabi-v7a',
            'linux-x86-64/libjnidispatch.so': 'x86_64',
            'linux-x86/libjnidispatch.so': 'x86'
        ]

        def generatedJniLibsDir = layout.buildDirectory.dir("generated/jniLibs").get().asFile

        java.util.zip.ZipFile zip = new java.util.zip.ZipFile(jnaJarFile)
        zip.entries().each { entry ->
            def name = entry.name.replace('\\', '/')
            mapping.each { jnaPath, androidAbi ->
                if (name.contains(jnaPath)) {
                    def targetDir = new File(generatedJniLibsDir, androidAbi)
                    targetDir.mkdirs()
                    def targetSo = new File(targetDir, "libjnidispatch.so")
                    targetSo.bytes = zip.getInputStream(entry).bytes
                    logger.lifecycle("Extracted ${jnaPath} to ${targetSo.absolutePath}")
                }
            }
        }
        zip.close()
    }
}

tasks.named('preBuild').configure {
    dependsOn('extractJnaNatives')
}

tasks.register('downloadWhisperModel') {
    description = 'Downloads Whisper GGML model file from HuggingFace into src/main/assets/models'
    group = 'whisper'

    def whisperModelProvider = providers.gradleProperty('whisperModel').orElse('tiny')
    def modelsDir = file("src/main/assets/models")

    doLast {
        def modelParam = whisperModelProvider.get()
        def variant = modelParam.trim()
        if (variant.startsWith('ggml-')) {
            variant = variant.substring(5)
        }
        if (variant.endsWith('.bin')) {
            variant = variant.substring(0, variant.length() - 4)
        }

        def fileName = "ggml-${variant}.bin"
        def targetFile = new File(modelsDir, fileName)

        if (!modelsDir.exists()) {
            modelsDir.mkdirs()
        }

        if (targetFile.exists() && targetFile.length() > 0) {
            logger.lifecycle("Whisper model file already exists: ${targetFile.absolutePath}")
            return
        }

        def downloadUrl = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/${fileName}"
        logger.lifecycle("Downloading Whisper model '${variant}' from ${downloadUrl}...")

        ant.get(src: downloadUrl, dest: targetFile, skipexistic: false)
        logger.lifecycle("Successfully downloaded ${fileName} (${targetFile.length()} bytes)")
    }
}
